# Headless env for LUMI (segment_neurons.py, NeuronSeparator, NeuronSkeletonizer, kmeans_viewer).
# Same versions as the Mac env `vadis` (envs/vadis_requirements.txt); GUI packages (napari, Qt) and BSB/NEST left out.
# Build on LUMI with the container wrapper (see hpc/lumi/README.md):
#   conda-containerize new --prefix <dir> envs/senpai_lumi.yml
name: senpai
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - numpy==1.26.4
      - scipy==1.16.2
      - scikit-image==0.25.2
      - scikit-learn==1.7.2
      - joblib==1.5.2
      - threadpoolctl==3.6.0
      - tifffile==2025.10.4
      - matplotlib==3.10.9
      - contourpy==1.3.3
      - pillow==11.3.0
      - imageio==2.37.0
      - networkx==3.5
      - lazy_loader==0.4
      - packaging==25.0
